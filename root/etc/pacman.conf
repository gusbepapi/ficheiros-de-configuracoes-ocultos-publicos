[options]
CacheDir          = /home/gusbepapi/Packages/Pacman/
Architecture      = auto
HoldPkg           = pacman glibc dracut kernel-install-for-dracut eos-dracut pipewire pipewire-alsa pipewire-pulse
# IgnorePkg         =
LocalFileSigLevel = Optional
SigLevel          = Required DatabaseOptional

# 🇬🇧 Misc options
# 🇫🇷 Options diverses
# 🇪🇸 Opciones varias
# 🇮🇹 Opzioni varie
# 🇵🇹 Opcções diversas
Color
ILoveCandy
CheckSpace
VerbosePkgLists
DisableDownloadTimeout
ParallelDownloads = 10

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# [community]
# Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# 🇬🇧 Unofficial mirrors
# 🇫🇷 Mirrors non officiels
# 🇪🇸 Mirros no oficiales
# 🇮🇹 Mirror non ufficiali
# 🇵🇹 Mirrors não oficiais
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist

[endeavouros]
SigLevel = PackageRequired
Include = /etc/pacman.d/endeavouros-mirrorlist

[ownstuff-testing]
Server = https://ftp.f3l.de/~martchus/$repo/os/$arch
Server = https://martchus.dyn.f3l.de/repo/arch/$repo/os/$arch

[ownstuff]
Server = https://ftp.f3l.de/~martchus/$repo/os/$arch
Server = https://martchus.dyn.f3l.de/repo/arch/$repo/os/$arch
