#########################################################################
# 🇬🇧 SOURCE ACQUISITION
# 🇵🇹 AQUISIÇÃO DE FONTES
# 🇪🇸 ADQUISICIÓN DE FUENTES
#########################################################################
#
#-- 🇬🇧 The download utilities that makepkg should use to acquire sources
#-- 🇵🇹 Os utilitários de transferência que o makepkg deve utilizar para adquirir as fontes
#-- 🇪🇸 Los utilitarios de descarga que makepkg debe utilizar para adquirir las fuentes

DLAGENTS=('file::/usr/bin/curl -gqC - -o %o %u'
          'ftp::/usr/bin/curl -gqfC - --ftp-pasv --retry 3 --retry-delay 3 -o %o %u'
          'http::/usr/bin/curl -gqb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'https::/usr/bin/curl -gqb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'scp::/usr/bin/scp -C %u %o')

#-- 🇬🇧 The package required by makepkg to download VCS sources
#-- 🇵🇹 O pacote necessário pelo makepkg para adquirir as fontes de VCS
#-- 🇪🇸 El paquete requerido por makepkg para adquirir las fuentes de VCS
VCSCLIENTS=('bzr::bzr'
            'git::git'
            'hg::mercurial'
            'svn::subversion')

#########################################################################
# 🇬🇧 ARCHITECTURE, COMPILE FLAGS
# 🇵🇹 ARQUITETURA, FLAGS DE COMPILAÇÃO
# 🇪🇸 ARQUITECTURA, FLAGS DE COMPILACIÓN
#########################################################################

CARCH="x86_64"
CHOST="x86_64-pc-linux-gnu"

#-- 🇬🇧 Compiler and linker flags
#-- 🇵🇹 Flags do compilador e do ligador
#-- 🇪🇸 Flags del compilador y del enlazador
CPPFLAGS="-D_FORTIFY_SOURCE=2"
CFLAGS="-march=x86-64 -mtune=generic -O2 -pipe -fstack-protector-strong -fno-plt"
CXXFLAGS="-march=x86-64 -mtune=generic -O2 -pipe -fstack-protector-strong -fno-plt"
LDFLAGS="-Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now"
RUSTFLAGS="-C opt-level=2"

#-- 🇬🇧 Make Flags: changing this for DistCC/SMP systems
#-- 🇵🇹 Flags do Make: altere isto para sistemas de DistCC/SMP
#-- 🇪🇸 Flags del Make: cambie esto para sistemas de DistCC/SMP
MAKEFLAGS="-j$(nproc)"

#-- 🇬🇧 Debugging flags
#-- 🇵🇹 Flags de depuração
#-- 🇪🇸 Flags de depuración
DEBUG_CFLAGS="-g -fvar-tracking-assignments"
DEBUG_CXXFLAGS="-g -fvar-tracking-assignments"
DEBUG_RUSTFLAGS="-C debuginfo=2"

#########################################################################
# 🇬🇧 BUILD ENVIRONMENT
# 🇵🇹 AMBIENTE DE COMPILAÇÃO
# 🇪🇸 AMBIENTE DE COMPILACIÓN
#########################################################################

# 🇬🇧 Makepkg defaults: BUILDENV=(!distcc !color !ccache check !sign)
#     🇬🇧 A negated environment option will do the opposite of the comments below.

# 🇵🇹 Makepkk padrões: BUILDENV=(!distcc !color !ccache check !sign)
#     🇵🇹 Uma opção de ambiente negada fará o oposto dos comentários abaixo.

# 🇪🇸 Makepkg por defecto: BUILDENV=(!distcc !color !ccache check !sign)
#     🇪🇸 Una opción de ambiente negada hará lo opuesto de los comentarios de abajo.
#
#-- distcc:   🇬🇧 Using the Distributed C/C++/ObjC compiler
#             🇵🇹 Utilizar o compilador distribuído de C/C++/ObjC
#             🇪🇸 Usar el compilador distribuido de C/C++/ObjC
#-- color:    🇬🇧 Colourising output messages
#             🇵🇹 Colorir as mensagens de saída
#             🇪🇸 Colorear los mensajes de salida
#-- ccache:   🇬🇧 Using ccache to cache compilation
#             🇵🇹 Utilizar ccache para armazenar a compilação
#             🇪🇸 Usar ccache para almacenar la compilación
#-- check:    🇬🇧 Runing the check() function if present in the PKGBUILD
#             🇵🇹 Executar a função check() se presente no PKGBUILD
#             🇪🇸 Ejecutar la función check() si está presente en el PKGBUILD
#-- sign:     🇬🇧 Generating a PGP signature file
#             🇵🇹 Gerar um ficheiro de assinatura PGP
#             🇪🇸 Generar un fichero de firma PGP
#
BUILDENV=(!distcc color !ccache check !sign)

#-- 🇬🇧 Specifying a directory for package building.
#-- 🇵🇹 Especificar um diretório para a compilação de pacotes.
#-- 🇪🇸 Especificar un directorio para la compilación de paquetes.
BUILDDIR=/tmp/makepkg

#########################################################################
# 🇬🇧 GLOBAL PACKAGE OPTIONS
# 🇵🇹 OPÇÕES GLOBAIS DE PACOTES
# 🇪🇸 OPCIONES GLOBALES DE PAQUETES
#   🇬🇧 These are default values for the options=() settings
#   🇵🇹 Estes são os valores padrão para as configurações options=()
#   🇪🇸 Estos son los valores por defecto para las configuraciones options=()
#########################################################################
#
# 🇬🇧 Makepkg defaults: OPTIONS=(!strip docs libtool staticlibs emptydirs !zipman !purge !debug !lto)
#    🇬🇧 A negated option will do the opposite of the comments below.

# 🇵🇹 Makepkg padrões: OPTIONS=(!strip docs libtool staticlibs emptydirs !zipman !purge !debug !lto)
#    🇵🇹 Uma opção negada fará o oposto dos comentários abaixo.

# 🇪🇸 Makepkg por defecto: OPTIONS=(!strip docs libtool staticlibs emptydirs !zipman !purge !debug !lto)
#    🇪🇸 Una opción negada hará lo opuesto de los comentarios de abajo.
#
#-- strip:      🇬🇧 Stripping symbols from binaries/libraries
#               🇵🇹 Remover os símbolos dos binários/bibliotecas
#               🇪🇸 Quitar los símbolos de los binarios/bibliotecas
#-- docs:       🇬🇧 Saving doc directories specified by DOC_DIRS
#               🇵🇹 Guardar os diretórios de documentação especificados por DOC_DIRS
#               🇪🇸 Guardar los directorios de documentación especificados por DOC_DIRS
#-- libtool:    🇬🇧 Leaving libtool (.la) files in packages
#               🇵🇹 Deixar os ficheiros libtool (.la) nos pacotes
#               🇪🇸 Dejar los ficheros libtool (.la) en los paquetes
#-- staticlibs: 🇬🇧 Leaving static library (.a) files in packages
#               🇵🇹 Deixar as bibliotecas estáticas (.a) nos pacotes
#               🇪🇸 Dejar las bibliotecas estáticas (.a) en los paquetes
#-- emptydirs:  🇬🇧 Leaving empty directories in packages
#               🇵🇹 Deixar os diretórios vazios nos pacotes
#               🇪🇸 Dejar los directorios vacíos en los paquetes
#-- zipman:     🇬🇧 Compressing manual (man and info) pages in MAN_DIRS with gzip
#               🇵🇹 Comprimir as páginas de manual (man e info) em MAN_DIRS com gzip
#               🇪🇸 Comprimir las páginas de manual (man e info) en MAN_DIRS con gzip
#-- purge:      🇬🇧 Removing files specified by PURGE_TARGETS
#               🇵🇹 Remover os ficheiros especificados por PURGE_TARGETS
#               🇪🇸 Quitar los ficheros especificados por PURGE_TARGETS
#-- debug:      🇬🇧 Adding debugging flags as specified in DEBUG_* variables
#               🇵🇹 Adicionar flags de depuração como especificado nas variáveis de DEBUG_*
#               🇪🇸 Añadir flags de depuración como especificado en las variables de DEBUG_*
#-- lto:        🇬🇧 Adding compile flags for building with link time optimization
#               🇵🇹 Adicionar flags de compilação para compilar com otimização de tempo de ligação
#               🇪🇸 Añadir flags de compilación para compilar con optimización de tiempo de enlace
#
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug)

#-- 🇬🇧 File integrity checks to use. Valid: b2, md5, sha1, sha224, sha256, sha384, sha512
#-- 🇵🇹 Verificações de integridade de ficheiros a usar. Válido: b2, md5, sha1, sha224, sha256, sha384, sha512
#-- 🇪🇸 Comprobaciones de integridad de ficheros a usar. Válido: b2, md5, sha1, sha224, sha256, sha384, sha512
INTEGRITY_CHECK=(sha256)

#-- 🇬🇧 Options to be used when stripping binaries. See `man strip' for details.
#-- 🇵🇹 Opções a utilizar ao remover os símbolos dos binários. Veja `man strip' para mais detalhes.
#-- 🇪🇸 Opciones a usar al quitar los símbolos de los binarios. Vea `man strip' para más detalles.
STRIP_BINARIES="--strip-all"

#-- 🇬🇧 Options to be used when stripping shared libraries. See `man strip' for details.
#-- 🇵🇹 Opções a utilizar ao remover os símbolos das bibliotecas partilhadas. Veja `man strip' para mais detalhes.
#-- 🇪🇸 Opciones a usar al quitar los símbolos de las bibliotecas compartidas. Vea `man strip' para más detalles.
STRIP_SHARED="--strip-unneeded"

#-- 🇬🇧 Options to be used when stripping static libraries. See `man strip' for details.
#-- 🇵🇹 Opções a utilizar ao remover os símbolos das bibliotecas estáticas. Veja `man strip' para mais detalhes.
#-- 🇪🇸 Opciones a usar al quitar los símbolos de las bibliotecas estáticas. Vea `man strip' para más detalles.
STRIP_STATIC="--strip-debug"

#-- 🇬🇧 Manual (man and info) directories to compress (if zipman is specified)
#-- 🇵🇹 Diretórios manuais (man e info) para compactar (se zipman for especificado)
#-- 🇪🇸 Directorios manuales (man e info) para comprimir (si se especifica zipman)
MAN_DIRS=({usr{,/local}{,/share},opt/*}/{man,info})

#-- 🇬🇧 Doc directories to remove (if !docs is specified)
#-- 🇵🇹 Diretórios de documentação para remover (se !docs for especificado)
#-- 🇪🇸 Directorios de documentación para quitar (si !docs se especifica)
DOC_DIRS=(usr/{,local/}{,share/}{doc,gtk-doc} opt/*/{doc,gtk-doc})

#-- 🇬🇧 Files to be removed from all packages (if purge is specified)
#-- 🇵🇹 Ficheiros a remover de todos os pacotes (se purge for especificado)
#-- 🇪🇸 Archivos a quitar de todos los paquetes (si se especifica purge)
PURGE_TARGETS=(usr/{,share}/info/dir .packlist *.pod)

#-- 🇬🇧 Directory to store source code in for debug packages
#-- 🇵🇹 Diretório para armazenar o código fonte nos pacotes de depuração
#-- 🇪🇸 Directorio para almacenar el código fuente en los paquetes de depuración
DBGSRCDIR="/usr/src/debug"

#########################################################################
# 🇬🇧 PACKAGE OUTPUT
# 🇵🇹 SAÍDA DE PACOTES
# 🇪🇸 SALIDA DE PAQUETES
#########################################################################
#
# 🇬🇧 Default: putting the built package and cached source in build directory
# 🇵🇹 Padrão: colocar o pacote construído e a fonte em cache no diretório de construção
# 🇪🇸 Por defecto: colocar el paquete construido y la fuente en caché en el directorio de construcción
#
#-- 🇬🇧 Destination: specifying a fixed directory where all packages will be placed
#-- 🇵🇹 Destino: especificar um diretório fixo onde todos os pacotes serão colocados
#-- 🇪🇸 Destino: especificar un directorio fijo donde se colocarán todos los paquetes
PKGDEST=${HOME}/Packages/AUR/packages

#-- 🇬🇧 Source cache: specifying a fixed directory where source files will be cached
#-- 🇵🇹 Cache de fonte: especificar um diretório fixo onde os ficheiros de fonte serão colocados em cache
#-- 🇪🇸 Caché de fuente: especificar un directorio fijo donde se colocarán los archivos de fuente en caché
SRCDEST=${HOME}/Packages/AUR/sources

#-- 🇬🇧 Source packages: specifying a fixed directory where all src packages will be placed
#-- 🇵🇹 Pacotes de fonte: especificar um diretório fixo onde todos os pacotes src serão colocados
#-- 🇪🇸 Paquetes de fuente: especificar un directorio fijo donde se colocarán todos los paquetes src
SRCPKGDEST=${HOME}/Packages/AUR/srcpackages

#-- 🇬🇧 Log files: specifying a fixed directory where all log files will be placed
#-- 🇵🇹 Ficheiros de registo: especificar um diretório fixo onde todos os ficheiros de registo serão colocados
#-- 🇪🇸 Archivos de registro: especificar un directorio fijo donde se colocarán todos los archivos de registro
LOGDEST=${HOME}/Packages/AUR/makepkglogs

#-- 🇬🇧 Packager: name and email of the person or organization building packages
#-- 🇵🇹 Empacotador: nome e correio eletreonico da pessoa ou organização que constrói os pacotes
#-- 🇪🇸 Empaquetador: nombre y e-mail de la persona u organización que construye los paquetes
# PACKAGER="John Doe <john@doe.com>"

#-- 🇬🇧 Specifying a key to use for package signing
#-- 🇵🇹 Especificar uma chave para usar na assinatura dos pacotes
#-- 🇪🇸 Especificar una clave para usar en la firma de los paquetes
# GPGKEY=""

#########################################################################
# 🇬🇧 COMPRESSION DEFAULTS
# 🇵🇹 VALORES PREDEFINIDOS PARA A COMPRESSÃO
# 🇪🇸 VALORES PREDETERMINADOS PARA LA COMPRESIÓN
#########################################################################

; COMPRESSGZ=(pigz -c -f -n)
; COMPRESSBZ2=(bzip2 -c -f)
; COMPRESSXZ=(xz -c -z - --threads=0)
; COMPRESSZST=(zstd -c -T0 --ultra -20 -z -q -)
; COMPRESSLRZ=(lrzip -q)
; COMPRESSLZO=(lzop -q)
; COMPRESSZ=(compress -c -f)

COMPRESSGZ=(zstd -c -T0 --ultra -20 -z -q -)
COMPRESSBZ2=(zstd -c -T0 --ultra -20 -z -q -)
COMPRESSXZ=(zstd -c -T0 --ultra -20 -z -q -)
COMPRESSZST=(zstd -c -T0 --ultra -20 -z -q -)
COMPRESSLRZ=(zstd -c -T0 --ultra -20 -z -q -)
COMPRESSLZO=(zstd -c -T0 --ultra -20 -z -q -)
COMPRESSZ=(zstd -c -T0 --ultra -20 -z -q -)

#########################################################################
# 🇬🇧 EXTENSION DEFAULTS
# 🇵🇹 VALORES PREDEFINIDOS PARA EXTENSÕES
# 🇪🇸 VALORES PREDETERMINADOS PARA EXTENSIONES
#########################################################################

; PKGEXT='.pkg.tar.zst'
; SRCEXT='.src.tar.gz'

PKGEXT=".pkg.tar.aur"
SRCEXT='.src.tar.aur'

#########################################################################
# 🇬🇧 OTHER
# 🇵🇹 OUTROS
# 🇪🇸 OTROS
#########################################################################

