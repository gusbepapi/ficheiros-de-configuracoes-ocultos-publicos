<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--

🇬🇧 Twitter Colour Emoji Font
🇵🇹 Fonte de Emojis Coloridos do Twitter
🇪🇸 Fuente de Emojis de Color de Twitter

🇬🇧 Font confuguration fie for a custom favourite font default
🇵🇹 Ficheiro de configuração de fonte para um tipo de letra padrão favorito personalizado
🇪🇸 Archivo de configuración de fuente para una fuente predeterminada personalizada favorita

🇬🇧 This file is part of the Twemoji project
🇵🇹 Este ficheiro é parte do projeto Twemoji
🇪🇸 Este archivo es parte del proyecto Twemoji
https://github.com/eosrei/twemoji-color-font

🇬🇧 This font configuration makes IBM Plex the default font for monospace, sans-serif and serif font requests since it does not contain any Unicode emoji characters. Twitter Color Emoji font is the first fallback, followed by IBM Plex (or whatever the existing default is) to provide everything else.
🇵🇹 Esta configuração de fonte torna o IBM Plex a fonte padrão para pedidos de fonte monoespaçada, sem serifa e serifada, uma vez que não contém quaisquer caracteres de emojis do Unicode. A fonte de emojis coloridos do Twitter é o primeiro fallback, seguido pelo IBM Plex (ou qualquer outro padrão existente) para fornecer o resto.

🇬🇧 To get IBM Plex, download it from
🇵🇹 Para obter o IBM Plex, descarregue-o de
🇪🇸 Para obtener IBM Plex, descárguelo de
http://ibm.com/plex

🇬🇧 Test with:
🇵🇹 Teste com:
🇪🇸 Prueba con:
fc-match -s serif
fc-match -s sans-serif
fc-match -s monospace

-->

<fontconfig>
  <match target="font">
    <!-- 🇬🇧 If the requested font is IBM Plex Serif -->
    <!-- 🇵🇹 Se a fonte solicitada for IBM Plex Serif -->
    <!-- 🇪🇸 Si la fuente solicitada es IBM Plex Serif -->
    <test name="family" compare="eq">
        <string>IBM Plex Serif</string>
    </test>

    <!-- 🇬🇧 Replace the entire match list with IBM Plex Serif alone -->
    <!-- 🇵🇹 Substitua a lista de correspondência inteira por IBM Plex Serif sozinho -->
    <!-- 🇪🇸 Reemplace la lista de coincidencias completa solo con IBM Plex Serif -->
    <edit name="family" mode="assign_replace">
      <string>IBM Plex Serif</string>
    </edit>

    <!-- 🇬🇧 Assign the serif family -->
    <!-- 🇵🇹 Atribua a família serifada -->
    <!-- 🇪🇸 Asigne la familia serifada -->
    <edit name="family" mode="append_last">
      <string>serif</string>
    </edit>
  </match>

  <match>
    <!-- 🇬🇧 If the requested font is serif -->
    <!-- 🇵🇹 Se a fonte solicitada for serifada -->
    <!-- 🇪🇸 Si la fuente solicitada es serifada -->
    <test qual="any" name="family">
        <string>serif</string>
    </test>

    <!-- 🇬🇧 Make IBM Plex Serif the first result -->
    <!-- 🇵🇹 Faça com que o IBM Plex Serif seja o primeiro resultado -->
    <!-- 🇪🇸 Haga que IBM Plex Serif sea el primer resultado -->
    <edit name="family" mode="prepend_first">
      <string>IBM Plex Serif</string>
    </edit>

    <!-- 🇬🇧 Followed by Twemoji font -->
    <!-- 🇵🇹 Seguido da fonte Twemoji -->
    <!-- 🇪🇸 Seguido da fonte Twemoji -->
    <edit name="family" mode="prepend_first">
      <string>Twitter Color Emoji</string>
    </edit>
  </match>

  <match target="font">
    <!-- 🇬🇧 If the requested font is IBM Plex Sans -->
    <!-- 🇵🇹 Se a fonte solicitada for IBM Plex Sans -->
    <!-- 🇪🇸 Si la fuente solicitada es IBM Plex Sans -->
    <test name="family" compare="eq">
        <string>IBM Plex Sans</string>
    </test>
    
    <!-- 🇬🇧 Replace the entire match list with IBM Plex Sans alone -->
    <!-- 🇵🇹 Substitua a lista de correspondência inteira por IBM Plex Sans sozinho -->
    <!-- 🇪🇸 Reemplace la lista de coincidencias completa solo con IBM Plex Sans -->
    <edit name="family" mode="assign_replace">
      <string>IBM Plex Sans</string>
    </edit>

    <!-- 🇬🇧 Assign the sans-serif family -->
    <!-- 🇵🇹 Atribua a família sem serifa -->
    <!-- 🇪🇸 Asigne la familia sin serifa -->
    <edit name="family" mode="append_last">
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <!-- 🇬🇧 If the requested font is sans-serif -->
    <!-- 🇵🇹 Se a fonte solicitada for sem serifa -->
    <!-- 🇪🇸 Si la fuente solicitada es sin serifa -->
    <test qual="any" name="family">
        <string>sans-serif</string>
    </test>

    <!-- 🇬🇧 Make IBM Plex Sans the first result -->
    <!-- 🇵🇹 Faça com que o IBM Plex Sans seja o primeiro resultado -->
    <!-- 🇪🇸 Haga que IBM Plex Sans sea el primer resultado -->
    <edit name="family" mode="prepend_first">
      <string>IBM Plex Sans</string>
    </edit>

    <!-- 🇬🇧 Followed by Twemoji -->
    <!-- 🇵🇹 Seguido da fonte Twemoji -->
    <!-- 🇪🇸 Seguido de la fuente Twemoji -->
    <edit name="family" mode="prepend_first">
      <string>Twitter Color Emoji</string>
    </edit>
  </match>

  <match target="font">
    <!-- 🇬🇧 If the requested font is IBM Plex Mono -->
    <!-- 🇵🇹 Se a fonte solicitada for IBM Plex Mono -->
    <!-- 🇪🇸 Si la fuente solicitada es IBM Plex Mono -->
    <test name="family" compare="eq">
        <string>IBM Plex Mono</string>
    </test>
    
    <!-- 🇬🇧 Replace the entire match list with IBM Plex Mono alone -->
    <!-- 🇵🇹 Substitua a lista de correspondência inteira por IBM Plex Mono sozinho -->
    <!-- 🇪🇸 Reemplace la lista de coincidencias completa solo con IBM Plex Mono -->
    <edit name="family" mode="assign_replace">
      <string>IBM Plex Mono</string>
    </edit>

    <!-- 🇬🇧 Assign the monospace family last -->
    <!-- 🇵🇹 Atribua a família monoespaçada por último -->
    <!-- 🇪🇸 Asigne la familia monoespaciada por último -->
    <edit name="family" mode="append_last">
      <string>monospace</string>
    </edit>
  </match>

  <match target="pattern">
    <!-- 🇬🇧 If the requested font is monospace -->
    <!-- 🇵🇹 Se a fonte solicitada for monoespaçada -->
    <!-- 🇪🇸 Si la fuente solicitada es monoespaciada -->
    <test qual="any" name="family">
        <string>monospace</string>
    </test>

    <!--
    🇬🇧 Make IBM Plex Mono the first result
    🇬🇧 Note: If you want a different monospace font, this is where you change it.

    🇵🇹 Faça com que o IBM Plex Mono seja o primeiro resultado
    🇵🇹 Nota: se você quiser uma fonte monoespaçada diferente, é aqui que você a altera.

    🇪🇸 Haga que IBM Plex Mono sea el primer resultado
    🇪🇸 Nota: si desea una fuente monoespaciada diferente, es aquí donde la cambia.
    -->
    <edit name="family" mode="prepend_first">
      <string>IBM Plex Mono</string>
    </edit>

    <!-- 🇬🇧 Followed by Twemoji font -->
    <!-- 🇵🇹 Seguido da fonte Twemoji -->
    <!-- 🇪🇸 Seguido de la fuente Twemoji -->
    <edit name="family" mode="prepend_first">
      <string>Twitter Color Emoji</string>
    </edit>
  </match>

  <!-- 🇬🇧 Adding an emoji generic family -->
  <!-- 🇵🇹 A adicionar uma família genérica de emoji -->
  <!-- 🇪🇸 Agregando una familia genérica de emoji -->
  <alias binding="strong">
    <family>emoji</family>
    <default><family>Twitter Color Emoji</family></default>
  </alias>

  <!-- 🇬🇧 Alias requests for the other emoji fonts -->
  <!-- 🇵🇹 Solicitações de alias para as outras fontes de emoji -->
  <!-- 🇪🇸 Solicitudes de alias para las otras fuentes de emoji -->
  <alias binding="strong">
    <family>Apple Color Emoji</family>
    <prefer><family>Twitter Color Emoji</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="strong">
    <family>Noto Color Emoji</family>
    <prefer><family>Twitter Color Emoji</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="strong">
    <family>Segoe UI Emoji</family>
    <prefer><family>Twitter Color Emoji</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
</fontconfig>
