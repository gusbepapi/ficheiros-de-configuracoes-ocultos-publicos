<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <dir>~/.local/share/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <match target="font">
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintnone</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Hack</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>Blex Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>JoyPixels</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>ui-monospace</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Hack</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>Blex Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>JoyPixels</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>IBM Plex Serif</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>Blex Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>JoyPixels</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Blex Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>JoyPixels</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>emoji</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Blex Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>JoyPixels</string>
    </edit>
  </match>
  <match target="font">
    <test name="family" qual="any">
      <string>MiSans</string>
    </test>
    <edit name="fontfeatures" mode="assign_replace">
      <string>thum</string>
    </edit>
  </match>
  <dir>~/.fonts</dir>
  <match target="font">
    <test name="size" qual="any" compare="more_eq">
      <double>8</double>
    </test>
    <test name="size" qual="any" compare="less_eq">
      <double>15</double>
    </test>
    <edit name="antialias" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
  <match target="font">
    <test name="pixelsize" qual="any" compare="more_eq">
      <double>11</double>
    </test>
    <test name="pixelsize" qual="any" compare="less_eq">
      <double>20</double>
    </test>
    <edit name="antialias" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
  <match target="font">
    <test name="size" qual="any" compare="more_eq">
      <double>8</double>
    </test>
    <test name="size" qual="any" compare="less_eq">
      <double>15</double>
    </test>
    <edit name="antialias" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
  <match target="font">
    <test name="pixelsize" qual="any" compare="more_eq">
      <double>11</double>
    </test>
    <test name="pixelsize" qual="any" compare="less_eq">
      <double>20</double>
    </test>
    <edit name="antialias" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
  <match target="font">
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <edit name="hintstyle" mode="assign">
      <const>hintfull</const>
    </edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
  <match target="font">
    <test name="size" qual="any" compare="more_eq">
      <double>10</double>
    </test>
    <test name="size" qual="any" compare="less_eq">
      <double>15</double>
    </test>
    <edit name="antialias" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
  <match target="font">
    <test name="pixelsize" qual="any" compare="more_eq">
      <double>13</double>
    </test>
    <test name="pixelsize" qual="any" compare="less_eq">
      <double>20</double>
    </test>
    <edit name="antialias" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
  <match target="font">
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
</fontconfig>
