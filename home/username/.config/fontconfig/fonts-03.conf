<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <dir>~/.local/share/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <match target="font">
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintnone</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" binding="same" mode="assign">
      <string>Hack</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>Blex Mono</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>OpenMoji Color</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>Untitled1</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>ui-monospace</string>
    </test>
    <edit name="family" binding="same" mode="assign">
      <string>Hack</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>Blex Mono</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>OpenMoji Color</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>Untitled1</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" binding="same" mode="assign">
      <string>IBM Plex Serif</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>Blex Mono</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>OpenMoji Color</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>Untitled1</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" binding="same" mode="assign">
      <string>IBM Plex Sans</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>Blex Mono</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>OpenMoji Color</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>Untitled1</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>emoji</string>
    </test>
    <edit name="family" binding="same" mode="assign">
      <string>Blex Mono</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>OpenMoji Color</string>
    </edit>
    <edit name="family" binding="weak" mode="append">
      <string>Untitled1</string>
    </edit>
  </match>
  <dir>~/.fonts</dir>
</fontconfig>