<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Hiding the pre-installed system fonts, including the whole Noto collection, to shorten the font lists of the applications such as Figma and Inkscape -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/*</glob>
      <glob>/usr/local/share/fonts/*</glob>
    </rejectfont>
    <!-- Keeping the small set of system fonts that the lists above use as fallbacks; the user fonts in ~/.local/share/fonts are never hidden -->
    <acceptfont>
      <pattern><patelt name="family"><string>Adwaita Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>Adwaita Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>DejaVu Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>DejaVu Sans Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>DejaVu Serif</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Serif</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Mono</string></patelt></pattern>
    </acceptfont>
  </selectfont>
</fontconfig>
