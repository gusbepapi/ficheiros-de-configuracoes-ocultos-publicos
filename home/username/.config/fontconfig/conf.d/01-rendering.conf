<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Rendering every font with light hinting, grey and sub-pixel anti-aliasing, and no auto-hinter -->
  <match target="font">
    <edit mode="assign" name="antialias"><bool>true</bool></edit>
    <edit mode="assign" name="hinting"><bool>true</bool></edit>
    <edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
    <edit mode="assign" name="autohint"><bool>false</bool></edit>
    <edit mode="assign" name="rgba"><const>rgb</const></edit>
    <edit mode="assign" name="lcdfilter"><const>lcddefault</const></edit>
  </match>

  <!-- Keeping the embedded bitmaps and the scalable flag of the colour emoji fonts -->
  <match target="font">
    <test name="family"><string>OpenMoji Color</string></test>
    <edit mode="assign" name="embeddedbitmap"><bool>true</bool></edit>
    <edit mode="assign" name="scalable"><bool>true</bool></edit>
  </match>
</fontconfig>
