<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Preferring the fonts below for «monospace», in this order; fontconfig falls back to the next font for every character the previous font lacks -->
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Adwaita Mono</family>
      <family>M PLUS 1 Code</family>
      <family>Maple Mono NF CN</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Unifont</family>
      <family>DejaVu Sans Mono</family>
      <family>Liberation Mono</family>
    </prefer>
    <!-- Placing the colour emoji fonts after the text fonts, so that letters and digits never come from an emoji font -->
    <accept>
      <family>OpenMoji Color</family>
      <family>Twitter Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
