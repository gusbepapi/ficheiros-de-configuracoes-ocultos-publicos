<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Preferring the fonts below for «sans-serif», in this order; fontconfig falls back to the next font for every character the previous font lacks -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <!-- <family>Ǣċesuperāluese Moderne LGBT</family> (to enable once the family is built) -->
      <family>Google Sans</family>
      <family>Inter</family>
      <family>Rounded Mplus 1c</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
    </prefer>
    <!-- Placing the colour emoji fonts after the text fonts, so that letters and digits never come from an emoji font -->
    <accept>
      <family>OpenMoji Color</family>
      <family>Twitter Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
