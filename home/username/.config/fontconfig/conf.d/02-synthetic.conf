<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
  <!-- Artificial oblique for fonts without an italic or oblique variant -->
  <match target="font">
    <!-- Filters out OpenMoji first so its bitmaps are not broken by slanting -->
    <test compare="not_eq" name="family">
      <string>OpenMoji Color</string>
    </test>
    <test name="slant">
      <const>roman</const>
    </test>
    <test compare="not_eq" name="slant" target="pattern">
      <const>roman</const>
    </test>
    <edit mode="assign" name="matrix">
      <times>
        <name>matrix</name>
        <matrix>
          <double>1</double>
          <double>0.2</double>
          <double>0</double>
          <double>1</double>
        </matrix>
      </times>
    </edit>
    <edit mode="assign" name="slant"><const>oblique</const></edit>
    <edit mode="assign" name="embeddedbitmap"><bool>false</bool></edit>
  </match>

  <!-- Synthetic emboldening for fonts lacking a bold face -->
  <match target="font">
    <test compare="less_eq" name="weight"><const>medium</const></test>
    <test compare="more_eq" name="weight" target="pattern"><const>bold</const></test>
    <edit mode="assign" name="embolden"><bool>true</bool></edit>
    <edit mode="assign" name="weight"><const>bold</const></edit>
  </match>
</fontconfig>
