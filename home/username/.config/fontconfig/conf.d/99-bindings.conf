<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>

  <!-- Force OpenMoji Color to append directly behind Adwaita Mono queries -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Adwaita Mono</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>OpenMoji Color</string>
    </edit>
  </match>

  <!-- Intercept generic emoji requests inside an Adwaita environment -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Adwaita Mono</string>
    </test>
    <test qual="any" name="family">
      <string>emoji</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>OpenMoji Color</string>
    </edit>
  </match>

</fontconfig>
