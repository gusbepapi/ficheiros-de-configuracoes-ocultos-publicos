<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Preferring the OpenMoji font for the generic family «emoji», then the Twemoji font, and then the normal sans fonts for letters and digits -->
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>OpenMoji Color</family>
      <family>Twitter Color Emoji</family>
    </prefer>
    <accept>
      <family>sans-serif</family>
    </accept>
  </alias>
</fontconfig>
