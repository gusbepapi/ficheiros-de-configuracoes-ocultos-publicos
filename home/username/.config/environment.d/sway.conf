# 🇬🇧 To fix Java on Wayland
# 🇵🇹 Corrigir o Java no Wayland
# 🇪🇸 Corregir Java en Wayland
_JAVA_AWT_WM_NONREPARENTING=1
_JAVA_OPTIONS='-Dawt.useSystemAAFontSettings=on -Dswing.aatext=true -Dswing.defaultlaf=com.sun.java.swing.plaf.gtk.GTKLookAndFeel'

# 🇬🇧 To enable QT5c or QT6c theming and Wayland support
# 🇵🇹 Ativar o tema de QT5c ou QT6c e o suporte ao Wayland
# 🇪🇸 Habilitar el tema de QT5c o QT6c y el soporte de Wayland
QT_QPA_PLATFORMTHEME=qt5ct
QT_QPA_PLATFORM=wayland-egl
QT_WAYLAND_DISABLE_WINDOWDECORATION=1

# 🇬🇧 To fix Redshift on wlroots
# 🇵🇹 Corrigir Redshift no wlroots
# 🇪🇸 Corregir Redshift en wlroots
WLR_DRM_NO_ATOMIC=1

# 🇬🇧 Using Wayland in SDL2
# 🇵🇹 A utilizar Wayland no SDL2
# 🇪🇸 Usando Wayland en SDL2
SDL_VIDEODRIVER=wayland
