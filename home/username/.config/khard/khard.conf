[addressbooks]
[[contacts]]
path = ~/.contacts

[general]
debug = no
default_action = list
editor = vim
merge_editor = vimdiff

[contact table]
# 🇬🇧 To display names by first or last name: first_name or last_name
# 🇵🇹 Para mostrar nomes por primeiro ou último nome: first_name ou last_name
# 🇪🇸 Para mostrar nombres por primer o último nombre: first_name ou last_name
display = first_name
# 🇬🇧 To group by address book: yes or no
# 🇵🇹 Para agrupar por livro de endereços: yes ou no
# 🇪🇸 Para agrupar por libreta de direcciones: yes o no
group_by_addressbook = no
# 🇬🇧 To reverse table ordering: yes or no
# 🇵🇹 Para inverter a ordem da tabela: yes ou no
# 🇪🇸 Para invertir el orden de la tabla: yes o no
reverse = no
# 🇬🇧 To append nicknames to name column: yes or no
# 🇵🇹 Para anexar apelidos à coluna de nome: yes ou no
# 🇪🇸 Para anexar apodos a la columna de nombre: yes o no
show_nicknames = no
# 🇬🇧 To show uid table column: yes or no
# 🇵🇹 Para mostrar a coluna uid da tabela: yes ou no
# 🇪🇸 Para mostrar la columna uid de la tabla: yes o no
show_uids = yes
# 🇬🇧 To sort by first or last name: first_name or last_name
# 🇵🇹 Para ordenar por primeiro ou último nome: first_name ou last_name
# 🇪🇸 Para ordenar por primer o último nombre: first_name o last_name
sort = last_name
# 🇬🇧 Date localization: yes or no
# 🇵🇹 Localização de datas: yes ou no
# 🇪🇸 Localización de fechas: yes o no
localize_dates = yes
