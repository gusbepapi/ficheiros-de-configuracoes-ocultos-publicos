# 🇬🇧 Best folding style with this theme, in filedefs/filetypes.common:
# 🇵🇹 Melhor estilo de dobra com este tema, em filedefs/filetypes.common:
# 🇪🇸 Mejor estilo de plegado con este tema, en filedefs/filetypes.common:
# folding_style = 2,2

[theme_info]
name = Steampunk
description = A dark brown and shiny brass theme for the 19th century developer
description[en_GB] = A dark brown and shiny brass theme for the 19th century developer
description[es_ES] = Un tema oscuro marrón y brillante de latón para el desarrollador del siglo XIX
description[pt_BR] = Um tema escuro marrom e brilhante de latão para o desenvolvedor do século XIX
description[pt_PT] = Um tema escuro marrom e brilhante de latão para o desenvolvedor do século XIX
author = Baptiste Darthenay
url = https://github.com/batisteo/geany-themes/blob/master/steampunk.conf
version = 3

# 🇬🇧 List of each compatible Geany release versions
# 🇵🇹 Lista de cada versão compatível do Geany
# 🇪🇸 Lista de cada versión compatible de Geany
compat = 1.22; 1.23; 1.23.1; 1.24

[named_styles]
default = #fea; #252016; false; false
error = #faecbd; #a22

# 🇬🇧 Editor styles
# 🇵🇹 Estilos do editor
# 🇪🇸 Estilos del editor
brace_bad = #ce5c00; #484333; true
brace_good = #8ab634; #514630; true
call_tips = #ccc; #fff; false
caret = #d3d7cf; #000
current_line = #000; #342d1f; true
fold_symbol_highlight = #b79024; #252016
indent_guide = #b79024
margin_folding = #651; #362a1d
margin_line_number = #caa223
marker_line = #c4a000; #edd400
marker_mark = #8c5200; #cf7900
marker_search = #000; #0000f0
selection = #000; #605339; false; true
white_space = #650; ; true

# 🇬🇧 Programming languages
# 🇵🇹 Linguagens de programação
# 🇪🇸 Lenguajes de programación
comment = #786442
comment_doc = comment
comment_doc_keyword = comment_doc,bold
comment_doc_keyword_error = comment_doc,italic
comment_line = comment
comment_line_doc = comment_doc

number = #fce94f
number_1 = number
number_2 = number_1

class = type
function = #cf7900
parameter = function
type = #cf7900; ; true

keyword = #cc9d22; ; true
keyword_1 = keyword
keyword_2 = #729f9c
keyword_3 = keyword_1
keyword_4 = keyword_1

identifier = default
identifier_1 = identifier
identifier_2 = identifier_1
identifier_3 = identifier_1
identifier_4 = identifier_1

backticks = string_2
character = string_1
here_doc = string_2
string = #ebc95d
string_1 = string
string_2 = comment,italic
string_3 = default
string_4 = default
string_eol = string_1,italic
verbatim = string

decorator = #978; ; ; true
extra = #359
label = default,bold
operator = #fa5; ; true
other = default
preprocessor = #729f9c
regex = number_1
scalar = string_2

# 🇬🇧 Markup languages
# 🇵🇹 Linguagens de marcação
# 🇪🇸 Lenguajes de marcado
attribute = #729f9c
attribute_unknown = attribute
entity = default
tag = #729f9c
tag_end = tag,bold
tag_unknown = tag
value = string_1

# 🇬🇧 Difference
# 🇵🇹 Diferença
# 🇪🇸 Diferencia
line_added = #595
line_changed = preprocessor
line_removed = #a66