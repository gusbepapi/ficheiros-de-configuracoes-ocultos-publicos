[theme_info]
name = Pygments
description = Default Pygments theme for Geany
description[es] = Tema predeterminado de Pygments para Geany
description[pt] = Tema padrão do Pygments para Geany
description[pt_BR] = Tema padrão de Pygments para Geany
author = Nicolas Holvoët
url = http://pygments.org
version = 1226

# 🇬🇧 Incremented automatically, do not change manually
# 🇵🇹 Incrementado automaticamente, não altere manualmente
# 🇪🇸 Incrementado automáticamente, no cambie manualmente

# 🇬🇧 List of each compatible Geany release versions
# 🇵🇹 Lista de cada versão compatível do Geany
# 🇪🇸 Lista de cada versión compatible de Geany
compat = 1.22; 1.23; 1.23.1; 1.24

[named_styles]
default = #161616; #f8f8f8; false; false
error = #f00; #bfbfbf

# 🇬🇧 Editor styles
# 🇵🇹 Estilos do editor
# 🇪🇸 Estilos del editor
brace_bad = #ddd; #e0754a; true
brace_good = #9433ad; #dcd4e0; true
call_tips = default
caret = #000; #000; false
current_line = #2e3436; #e7e7e7; true
fold_symbol_highlight = #d6d6d6
indent_guide = #b5b5b5
margin_folding = #747474; #e1e1e1
margin_line_number = #3a4346; #d6d6d6
marker_line = #2e3436; #729fcf
marker_mark = #565656; #d4d4d4
marker_search = #2e3436; #fcaf3e
selection = #2e3436; #cacaca; false; true
white_space = #b5b5b5; ; true

# 🇬🇧 Programming languages
# 🇵🇹 Linguagens de programação
# 🇪🇸 Lenguajes de programación
comment = #408080; ; ; true
comment_doc = #3465a4; ; ; true
comment_doc_keyword = comment_doc,bold
comment_doc_keyword_error = comment_doc_keyword,italic
comment_line = comment
comment_line_doc = comment_doc

number = #666
number_1 = number
number_2 = number_1

class = type
function = #0026bc
parameter = function
type = #0032ff; ; true

keyword = #008000; ; true
keyword_1 = keyword
keyword_2 = #008000
keyword_3 = keyword_1
keyword_4 = keyword_1

identifier = default
identifier_1 = identifier
identifier_2 = identifier_1
identifier_3 = identifier_1
identifier_4 = identifier_1

backticks = string_2
character = string_1
here_doc = string_2
string = #ba2121; ; false; false
string_1 = string
string_2 = string_1
string_3 = default
string_4 = default
string_eol = string_1,italic
verbatim = string

decorator = #a2f
extra = #204a87
label = default,bold
operator = default
other = default
preprocessor = #af7100
regex = number_1
scalar = string_2

# 🇬🇧 Markup languages
# 🇵🇹 Linguagens de marcação
# 🇪🇸 Lenguajes de marcado
attribute = #0032ff; ; true
attribute_unknown = attribute,italic
entity = preprocessor
tag = #008000; ; true
tag_end = tag
tag_unknown = tag
value = string_1

# 🇬🇧 Difference
# 🇵🇹 Diferença
# 🇪🇸 Diferencia
line_added = #256a1b
line_changed = #ce5c00
line_removed = #a40000
