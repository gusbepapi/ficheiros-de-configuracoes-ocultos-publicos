[theme_info]
name = Retro
description = Inspired by old green screen terminals.
author = Matthew Brush
url = 
version = 6

# 🇬🇧 Incremented automatically, do not change manually
# 🇵🇹 Incrementado automaticamente, não altere manualmente
# 🇪🇸 Incrementado automáticamente, no cambie manualmente

# 🇬🇧 List of each compatible Geany release versions
# 🇵🇹 Lista de cada versão compatível do Geany
# 🇪🇸 Lista de cada versión compatible de Geany
compat = 1.22; 1.23; 1.23.1; 1.24

[named_styles]
default = #008500; #000; false; false
error = #c00

# 🇬🇧 Editor styles
# 🇵🇹 Estilos do editor
# 🇪🇸 Estilos del editor
brace_bad = default,bold
brace_good = default
call_tips = #000; #0c0; true; true
caret = #0c0; #000; true; true
current_line = ; ; false
fold_symbol_highlight = #000
fold_symbol_highlight = #000
indent_guide = default
margin_folding = default
margin_line_number = default
marker_line = default,italic
marker_mark = #0c0; #000
marker_search = ; #000
selection = #000; #0c0; true; true
white_space = #104e10; ; true

# 🇬🇧 Programming languages
# 🇵🇹 Linguagens de programação
# 🇪🇸 Lenguajes de programación
comment = #67e667
comment_doc = comment
comment_doc_keyword = comment_doc,bold
comment_doc_keyword_error = comment_doc,italic
comment_line = comment
comment_line_doc = comment_doc

number = #39e639
number_1 = number
number_2 = number_1

class = type
function = default
parameter = function
type = #0c0; ; true

keyword = #008500; ; true
keyword_1 = keyword
keyword_2 = keyword_1
keyword_3 = keyword_1
keyword_4 = keyword_1

identifier = default
identifier_1 = identifier
identifier_2 = identifier_1
identifier_3 = identifier_1
identifier_4 = identifier_1

backticks = string_2
character = string_1
here_doc = string_2
string = #269926; ; true
string_1 = string
string_2 = string_1
string_3 = default
string_4 = default
string_eol = string_1,italic

decorator = string_1,bold
label = default,bold
operator = default
other = default
preprocessor = default
regex = number_1
scalar = string_2

# 🇬🇧 Markup languages
# 🇵🇹 Linguagens de marcação
# 🇪🇸 Lenguajes de marcado
attribute = #0c0; ; true
attribute_unknown = attribute,bold
entity = default
tag = #0c0
tag_end = tag,bold
tag_unknown = tag,bold
value = string_1

# 🇬🇧 Difference
# 🇵🇹 Diferença
# 🇪🇸 Diferencia
line_added = #0c0
line_changed = #00c
line_removed = #c00