[theme_info]
name = Black Scheme
description = Black background, other colors
description[en_GB] = Black background, other colours
description[es] = Fondo negro, otros colores
description[pt_BR] = Fundo preto, outras cores
description[pt_PT] = Fundo preto, outras cores
author = Paul Lenton <lentonp(at)gmail(dot)com>
version = 1237

# 🇬🇧 Incremented automatically, do not change manually
# 🇵🇹 Incrementado automaticamente, não altere manualmente
# 🇪🇸 Incrementado automáticamente, no cambie manualmente

# 🇬🇧 List of each compatible Geany release versions
# 🇵🇹 Lista de cada versão compatível do Geany
# 🇪🇸 Lista de cada versión compatible de Geany
compat = 1.22; 1.23; 1.23.1; 1.24


[named_styles]
default = #fff; #000; false; false
error = #ff80c0; #000; false; false

# 🇬🇧 Editor styles
# 🇵🇹 Estilos do editor
# 🇪🇸 Estilos del editor
brace_bad = #c5360f; #000; true; false
brace_good = #ff0; #000; true; false
call_tips = #ccc; #fff; false; false
caret = #fff; #066; false; false
current_line = #8dc63f; #330; true; false
fold_symbol_highlight = #fff
indent_guide = #066; ; false; false
margin_folding = #222; #111; false; false
margin_line_number = #b2aeab; #404040; false; false
marker_line = #ff208c; #80d4b2; false; false
marker_mark = #810000; #000; false; false
marker_search = #ff0; #f00; false; false
selection = #f00; #404040; false; true
white_space = #ccc; ; true

# 🇬🇧 Programming languages
# 🇵🇹 Linguagens de programação
# 🇪🇸 Lenguajes de programación
comment = #f00
comment_doc = #f00; #070707; false; false
comment_doc_keyword = comment_doc,bold
comment_doc_keyword_error = comment_doc,italic
comment_line = comment
comment_line_doc = comment_doc

number = #28a8b4
number_1 = number
number_2 = number_1

class = type
function = default
parameter = function
type = #fff; ; true; false

keyword = #f39; ; true; false
keyword_1 = keyword
keyword_2 = #6f0; ; true; false
keyword_3 = keyword_1
keyword_4 = keyword_1

identifier = default
identifier_1 = identifier
identifier_2 = identifier_1
identifier_3 = identifier_1
identifier_4 = identifier_1

backticks = string_2
character = string_1
here_doc = string_2
string = #8dc63f
string_1 = string
string_2 = string_1
string_3 = default
string_4 = default
string_eol = #8dc63f; #000; false; false

decorator = string_1,bold
label = default,bold
operator = #fc0
other = default
preprocessor = #fff
regex = number_1
scalar = string_2

# 🇬🇧 Markup languages
# 🇵🇹 Linguagens de marcação
# 🇪🇸 Lenguajes de marcado
attribute = #bd96bd; #000; false; false
attribute_unknown = #fff; #000; false; false
entity = #fff; #000; false; false
tag = #6f0; #000; false; false
tag_end = #fff; #000; false; false
tag_unknown = #ccc; #000; false; false
value = #6f0; #000; false; false

# 🇬🇧 Difference
# 🇵🇹 Diferença
# 🇪🇸 Diferencia
line_added = #00f5ff; #000; false; false
line_changed = #399; #000; false; false
line_removed = #ff0; #000; false; false
