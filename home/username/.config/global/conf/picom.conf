# and Arch Wiki contributors: https://wiki.archlinux.org/index.php/Compton
# and picom Github: https://github.com/yshui/picom

# BACKEND
## 🇬🇧 Possible values: "glx", "xrender" or "xr_glx_hybrid"
## 🇵🇹 Valores possíveis: "glx", "xrender" ou "xr_glx_hybrid"
## 🇪🇸 Valores posibles: "glx", "xrender" ou "xr_glx_hybrid"
backend = "glx";

# 🇬🇧 GLX BACKEND OPTIONS
# 🇵🇹 OPÇÕES DO BACKEND DE GLX
# 🇪🇸 OPCIÓNES DEL BACKEND DE GLX
glx-no-stencil = true;
# glx-use-copysubbuffermesa = true;
# glx-no-rebind-pixmap = true;
# no-use-damage = false
# use-damage = true;

# 🇬🇧 XRENDER BACKEND OPTIONS
# 🇵🇹 OPÇÕES DO BACKEND DE XRENDER
# 🇪🇸 OPCIÓNES DEL BACKEND DE XRENDER
xrender-sync-fence = true;
# glx-swap-method = "undefined";

# 🇬🇧 SHADOWS
# 🇵🇹 SOMBRAS
# 🇪🇸 SOMBRAS

## 🇬🇧 Enabling client-side shadows on windows.
## 🇵🇹 Ativar sombras do lado do cliente nas janelas.
## 🇪🇸 Habilitar sombras del lado del cliente en las ventanas.
shadow = false;

## 🇬🇧 The blur radius for shadows. (default 12)
## 🇵🇹 O raio de desfoque das sombras. (padrão 12)
## 🇪🇸 El radio de desenfoque de las sombras. (predeterminado 12)
shadow-radius = 5;

## 🇬🇧 The left offset for shadows. (default -15)
## 🇵🇹 O deslocamento esquerdo das sombras. (padrão -15)
## 🇪🇸 El desplazamiento izquierdo de las sombras. (predeterminado -15)
shadow-offset-x = -5;

## 🇬🇧 The top offset for shadows. (default -15)
## 🇵🇹 O deslocamento superior das sombras. (padrão -15)
## 🇪🇸 El desplazamiento superior de las sombras. (predeterminado -15)
shadow-offset-y = -5;

## 🇬🇧 The translucency for shadows. (default .75)
## 🇵🇹 A translucidez das sombras. (padrão .75)
## 🇪🇸 La translucidez de las sombras. (predeterminado .75)
shadow-opacity = 0.5;

## 🇬🇧 Set if you want different colour shadows
## 🇵🇹 Defina se você quiser sombras de cores diferentes
## 🇪🇸 Establezca si desea sombras de colores diferentes
# shadow-red = 0.0;
# shadow-green = 0.0;
# shadow-blue = 0.0;

## 🇬🇧 Set if you want to exclude certain applications from having shadows
## 🇵🇹 Defina se você quiser excluir certas aplicações de ter sombras
## 🇪🇸 Establezca si desea excluir ciertas aplicaciones de tener sombras
shadow-exclude = [
    "! name~=''",
    "name *= 'Chrome'",
    "name *= 'Chromium'",
    "name *= 'compton'",
    "name *= 'picom'",
    "name *= 'VLC'",
    "name = 'Docky'",
    "name = 'Kupfer'",
    "name = 'Notification'",
    "name = 'Plank'",
    "class_g = 'Conky'",
    "class_g = 'Kupfer'",
    "class_g = 'Synapse'",
    "class_g ?= 'Notify-osd'",
    "class_g ?= 'Cairo-dock'",
    "class_g ?= 'Xfce4-notifyd'",
    "class_g ?= 'Xfce4-power-manager'",
    "(class_g = 'firefox' || class_g = 'Thunderbird') && (window_type = 'utility' || window_type = 'popup_menu') && argb",
    "_GTK_FRAME_EXTENTS@:c",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
    "_NET_WM_WINDOW_TYPE:a *= '_KDE_NET_WM_WINDOW_TYPE_OVERRIDE'"
];

## 🇬🇧 Avoiding drawing shadow on all shaped windows
## 🇵🇹 Evitar desenhar sombras em todas as janelas com formas
## 🇪🇸 Evitar dibujar sombras en todas las ventanas con formas
shadow-ignore-shaped = false;

# 🇬🇧 OPACITY
# 🇵🇹 OPACIDADE
# 🇪🇸 OPACIDAD

active-opacity = 1;
frame-opacity = 1;
inactive-opacity = 1;
inactive-opacity-override = false;

## 🇬🇧 Dim inactive windows. (0.0 - 1.0)
## 🇵🇹 Diminuir janelas inativas. (0.0 - 1.0)
## 🇪🇸 Atenuar ventanas inactivas. (0.0 - 1.0)
# inactive-dim = 0.2;

## 🇬🇧 Preventing dimness from adjusting based on window opacity
## 🇵🇹 Impedir que a atenuação seja ajustada com base na opacidade da janela
## 🇪🇸 Evitar que la atenuación se ajuste en función de la opacidad de la ventana
# inactive-dim-fixed = true;

## 🇬🇧 Blur background of transparent windows. Bad performance with X Render backend. GLX backend is preferred.
## 🇵🇹 Desfocar o fundo das janelas transparentes. Má performance com o backend X Render. O backend GLX é preferido.
## 🇪🇸 Desenfocar el fondo de las ventanas transparentes. Mal rendimiento con el backend X Render. Se prefiere el backend GLX.
# blur-background = true;

## 🇬🇧 Blur background of opaque windows with transparent frames as well
## 🇵🇹 Também desfocar o fundo das janelas opacas com molduras transparentes
## 🇪🇸 También desenfocar el fondo de las ventanas opacas con marcos transparentes
# blur-background-frame = true;

## 🇬🇧 Preventing blur radius from adjusting based on window opacity
## 🇵🇹 Impedir que o raio de desfoque seja ajustado com base na opacidade da janela
## 🇪🇸 Evitar que el radio de desenfoque se ajuste en función de la opacidad de la ventana
blur-background-fixed = false;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# 🇬🇧 FADING
# 🇵🇹 DESAPARECIMENTO
# 🇪🇸 DESAPARICIÓN

## 🇬🇧 To fade the windows during opacity changes.
## 🇵🇹 Desvanecer as janelas durante as mudanças de opacidade.
## 🇪🇸 Desvanecer las ventanas durante los cambios de opacidad.
fading = true;

## 🇬🇧 The time between steps in a fade in milliseconds. (default 10).
## 🇵🇹 O tempo entre etapas num desvanecimento em milissegundos. (padrão 10).
## 🇪🇸 El tiempo entre pasos en un desvanecimiento en milisegundos. (predeterminado 10).
fade-delta = 4;

## 🇬🇧 Opacity change between steps while fading in. (default 0.028).
## 🇵🇹 Mudança de opacidade entre etapas durante o desvanecimento. (padrão 0.028).
## 🇪🇸 Cambio de opacidad entre pasos durante el desvanecimiento. (predeterminado 0.028).
fade-in-step = 0.03;

## 🇬🇧 Opacity change between steps while fading out. (default 0.03).
## 🇵🇹 Mudança de opacidade entre etapas durante o desvanecimento. (padrão 0.03).
## 🇪🇸 Cambio de opacidad entre pasos durante el desvanecimiento. (predeterminado 0.03).
fade-out-step = 0.03;

## 🇬🇧 To fade the windows in or out when opening or closing
## 🇵🇹 Desvanecer as janelas ao abrir ou fechar
## 🇪🇸 Desvanecer las ventanas al abrir o cerrar
# no-fading-openclose = true;

## 🇬🇧 Specifying a list of conditions of windows that should not be faded.
## 🇵🇹 Especificar uma lista de condições de janelas que não devem ser desvanecidas.
## 🇪🇸 Especificar una lista de condiciones de ventanas que no deben desvanecerse.
fade-exclude = [ ];

# 🇬🇧 OTHERS
# 🇵🇹 OUTROS
# 🇪🇸 OTROS

## 🇬🇧 To try to detect WM windows and to mark them as active.
## 🇵🇹 Tentar detectar janelas do WM e marcá-las como ativas.
## 🇪🇸 Intentar detectar ventanas del WM y marcarlas como activas.
mark-wmwin-focused = true;

## 🇬🇧 Mark all non-WM but override-redirect windows active (for example, menus).
## 🇵🇹 Marcar todas as janelas não-WM mas com redirecionamento de sobreposição como ativas (por exemplo, menus).
## 🇪🇸 Marcar todas las ventanas no-WM pero ccon redirección de superposición como activas (por ejemplo, menús).
mark-ovredir-focused = true;

# 🇬🇧 To use EWMH _NET_WM_ACTIVE_WINDOW to determine which window is focused instead of using FocusIn/Out events.
# 🇵🇹 Utilizar EWMH _NET_WM_ACTIVE_WINDOW para determinar qual janela está focada em vez de utilizar os eventos FocusIn/Out.
# 🇪🇸 Usar EWMH _NET_WM_ACTIVE_WINDOW para determinar qué ventana está enfocada en lugar de usar los eventos FocusIn/Out.
use-ewmh-active-win = true;

## 🇬🇧 To detect the rounded corners and to treat them as rectangular when --shadow-ignore-shaped is on.
## 🇵🇹 Detectar os cantos arredondados e tratá-los como retangulares quando --shadow-ignore-shaped está ligado.
## 🇪🇸 Detectar las esquinas redondeadas y tratarlas como rectangulares cuando --shadow-ignore-shaped está activado.
detect-rounded-corners = true;

## 🇬🇧 To detect _NET_WM_OPACITY on client windows, useful for window managers not passing _NET_WM_OPACITY of client windows to frame windows.
## 🇵🇹 Detectar _NET_WM_OPACITY nas janelas clientes, útil para gestores de janelas que não passam _NET_WM_OPACITY das janelas clientes para moldar as janelas. 
## 🇪🇸 Detectar _NET_WM_OPACITY en las ventanas clientes, útil para gestores de ventanas que no pasan _NET_WM_OPACITY de las ventanas clientes para encuadrar las ventanas.
detect-client-opacity = true;

## 🇬🇧 To specify the refresh rate of the screen
## 🇵🇹 Especificar a taxa de atualização do ecrã
## 🇪🇸 Especificar la tasa de actualización de la pantalla
refresh-rate = 0;

## 🇬🇧 Vertical synchronization: to match the refresh rate of the monitor
## 🇵🇹 Sincronização vertical: para corresponder à taxa de atualização do monitor
## 🇪🇸 Sincronización vertical: para corresponder a la tasa de actualización del monitor
vsync = false;

## 🇬🇧 Limiting Picom to repaint at most once every 1 / refresh_rate second to boost performance
## 🇵🇹 Limitar o Picom a repintar no máximo uma vez a cada 1 / segundo de taxa de atualização para melhorar o desempenho
## 🇪🇸 Limitar Picom a repintar como máximo una vez cada 1 / segundo de tasa de actualización para mejorar el rendimiento
# sw-opti = true;

## 🇬🇧 Unredirecting all windows if a fullscreen opaque window is detected, to maximize performance for the fullscreen windows, like games
## 🇵🇹 Desredirecionar todas as janelas se uma janela opaca em ecrã inteiro for detetada, para maximizar o desempenho para as janelas em ecrã inteiro, como jogos
## 🇪🇸 Desredireccionar todas las ventanas si se detecta una ventana opaca en pantalla completa, para maximizar el rendimiento para las ventanas en pantalla completa, como juegos
# unredir-if-possible = false; (fullscreen games behave better if true)
unredir-if-possible = false;

## 🇬🇧 To specify a list of conditions of windows that should always be considered focused
## 🇵🇹 Especificar uma lista de condições de janelas que devem sempre ser consideradas focadas
## 🇪🇸 Especificar una lista de condiciones de ventanas que siempre deben considerarse enfocadas
focus-exclude = [ ];

## 🇬🇧 To use WM_TRANSIENT_FOR to group the windows, and to consider them in the same group focused at the same time
## 🇵🇹 Utilizar WM_TRANSIENT_FOR para agrupar as janelas, e considerá-las focadas no mesmo grupo ao mesmo tempo
## 🇪🇸 Usar WM_TRANSIENT_FOR para agrupar las ventanas, y considerarlas en el mismo grupo enfocadas al mismo tiempo
detect-transient = true;

## 🇬🇧 To use WM_CLIENT_LEADER to group the windows, and consider the in the same group focused at the same time
## 🇵🇹 Utilizar WM_CLIENT_LEADER para agrupar as janelas, e considerá-las focadas no mesmo grupo ao mesmo tempo
## 🇪🇸 Usar WM_CLIENT_LEADER para agrupar las ventanas, y considerarlas en el mismo grupo enfocadas al mismo tiempo
detect-client-leader = true;

# 🇬🇧 WINDOW TYPE OPTIONS
# 🇵🇹 OPÇÕES DO TIPO DE JANELA
# 🇪🇸 OPCIONES DEL TIPO DE VENTANA

wintypes:
{
    tooltip =
    {
        # 🇬🇧 To fade the particular type of windows
        # 🇵🇹 Desvanecer o tipo particular de janelas
        # 🇪🇸 Desvanecer el tipo particular de ventanas
        fade = true;
        # 🇬🇧 To give the shadow to those windows
        # 🇵🇹 Dar sombra àquelas janelas
        # 🇪🇸 Dar sombra a esas ventanas
        shadow = false;

        # 🇬🇧 Default opacity for the type of windows
        # 🇵🇹 Opacidade padrão para o tipo de janelas
        # 🇪🇸 Opacidad predeterminada para el tipo de ventanas
        opacity = 0.85;

        # 🇬🇧 Whether to always consider windows of this type focused
        # 🇵🇹 Se deve sempre considerar as janelas deste tipo focadas
        # 🇪🇸 Siempre debe considerar las ventanas de este tipo enfocadas
        focus = true;
    };
};