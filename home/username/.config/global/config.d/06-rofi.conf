# ROFI

bindsym $mod+T exec rofi -show window \
		-config ~/.config/rofi/rofidmenu.rasi

bindsym $mod+D exec rofi -modi drun -show drun \
		-config ~/.config/rofi/rofidmenu.rasi

bindsym $mod+I exec rofi -modi drun -show drun -disable-history -sort -line-padding 4 \
                -columns 2 -padding 50 -hide-scrollbar \
                -show-icons -drun-icon-theme "Papirus-Dark" -font "SF Compact Rounded 14"

bindsym $mod+period exec rofi -modi emoji -show emoji -line-padding 4 \
                -columns 2 -padding 50 -hide-scrollbar -sort \
                -drun-icon-theme "Papirus-Dark" -font "SF Compact Rounded 14"

bindsym $mod+Z exec --no-startup-id rofi -modi calc -show calc -line-padding 4 \
                -columns 2 -padding 50 -hide-scrollbar \
                -drun-icon-theme "Papirus-Dark" -font "SF Compact Rounded 14" \
                -no-show-match -no-sort > /dev/null

bindsym mod1+J exec --no-startup-id jgmenu
