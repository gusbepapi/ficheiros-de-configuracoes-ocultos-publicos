### 🇬🇧 Keyboard layout switcher
### 🇵🇹 Alternador de layout do teclado
### 🇪🇸 Alternador de layout del teclado
bindsym mod1+Shift mode "$keyboard_layout"

set $keyboard_layout 'Keyboard Layout: (m) English (Machintosh), (e) Ελληνικά, (k) ქართული, (r) Русский, (u) Українська, (a) հայերեն'

mode "$keyboard_layout" 
{
        bindsym m exec --no-startup-id "setxkbmap -model macbookpro78 -layout us -variant mac           -option grp:alt_shift_toggle"
        bindsym e exec --no-startup-id "setxkbmap -model macbookpro78 -layout el -variant extended      -option grp:alt_shift_toggle"
        bindsym k exec --no-startup-id "setxkbmap -model macbookpro78 -layout ge -variant mess          -option grp:alt_shift_toggle"
        bindsym r exec --no-startup-id "setxkbmap -model macbookpro78 -layout ru -variant phonetic      -option winkeys"
        bindsym u exec --no-startup-id "setxkbmap -model macbookpro78 -layout ua -variant phonetic      -option winkeys"
        bindsym a exec --no-startup-id "setxkbmap -model macbookpro78 -layout am -variant phonetic-alt  -option winkeys"

        # back to normal: Enter or Esecape
        bindsym Return mode "default"
        bindsym Escape mode "default"
}

### 🇬🇧 Colour picker
### 🇵🇹 Seletor de cores
### 🇪🇸 Selector de colores
if [ "$DESKTOP_ENVIRONMENT" = "i3" ]; then
  bindsym $mod+Alt+C exec grim -g "$(slurp -p)" -t ppm - | convert - -format '%[pixel:p{0,0}]' txt:- | tail -n 1 | cut -d ' ' -f 4 | xclip -selection clipboard
else
  bindsym $mod+Alt+C exec grim -g "$(slurp -p)" -t ppm - | convert - -format '%[pixel:p{0,0}]' txt:- | tail -n 1 | cut -d ' ' -f 4 | wl-copy 
fi

## Swappy
bindsym $mod+Alt+S exec grim -g "$(slurp)" - | swappy -f - -o - | pngquant -

## Abrir a ligação da área de transferência no aplicativo padrão
## Open the clipboard link in the default application
bindsym $mod+Alt+O exec mimeo $(wl-paste)

