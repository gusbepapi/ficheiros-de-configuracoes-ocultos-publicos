### 🇪🇸 Lanzadores

#### 🇬🇧 Favourite launchers
#### 🇵🇹 Lançadores favoritos
#### 🇪🇸 Lanzadores favoritos

if [ "$DESKTOP_ENVIRONMENT" = "i3" ]; then
  bindsym $mod+space exec "krunner"
  bindsym ctrl+space exec "ulauncher"
else
  bindsym $mod+space exec "QT_QPA_PLATFORM=xcb krunner"
  bindsym ctrl+space exec "QT_QPA_PLATFORM=xcb ulauncher"
fi

if [[ "$DESKTOP_ENVIRONMENT" == "i3" ]]; then
  bindsym $mod+D exec --no-startup-id i3-dmenu-desktop
else
  ## 🇬🇧 Note: pass the final command to swaymsg so that the resulting window can be opened on the original workspace that the command was run on.
  ## 🇵🇹 Observação: passe o comando final para swaymsg para que a janela resultante possa ser aberta na área de trabalho original em que o comando foi executado.
  ## 🇪🇸 Nota: pase el comando final a swaymsg para que la ventana resultante pueda abrirse en el espacio de trabajo original en el que se ejecutó el comando.
  set $menu exec $term --class=launcher -e ~/.config/global/scripts/sway-launcher-desktop
  bindsym $mod+D exec $menu
fi

#### 🇬🇧 To start gmrun
#### 🇵🇹 Iniciar o gmrun
#### 🇪🇸 Iniciar el gmrun
bindsym $mod+Shift+D exec --no-startup-id gmrun

