# vim:ft=i3config

# 🇬🇧 APPEARANCES AND DESKTOP ENVIRONMENT THEMING
# 🇵🇹 APARÊNCIAS E PERSONALIZAÇÃO DO AMBIENTE DE TRABALHO
# 🇪🇸 APARIENCIAS Y PERSONALIZACIÓN DEL ENTORNO DE ESCRITORIO

## 🇬🇧 Font for window titles and menu bar
## 🇵🇹 Fonte para títulos de janelas e barra de menu
## 🇪🇸 Fuente para títulos de ventanas y barra de menú
# font pango: Bahnschrift 12
font pango: IBM Plex Sans 12

## 🇬🇧 Windows options
## 🇵🇹 Opções de janelas
## 🇪🇸 Opciones de ventanas

### 🇬🇧 Showing window title bars (not officially supported with i3gaps)
### 🇵🇹 Mostrar barras de título de janelas (não é oficialmente suportado com i3gaps)
### 🇪🇸 Mostrar barras de título de ventanas (no es oficialmente compatible con i3gaps)
# default_border normal

### 🇬🇧 To set floating (no markup) for special applications
### 🇵🇹 Definir flutuante (sem marcação) para aplicativos especiais
### 🇪🇸 Definir flotante (sin marcado) para aplicaciones especiales
for_window [app_id="^.*"] border pixel 4
for_window [class=".*"] border pixel 0
for_window [class=".*"] title_format "%class" 

### 🇬🇧 Setting inner or outer gaps
### 🇵🇹 Definir espaçamentos internos ou externos
### 🇪🇸 Definir espaciados internos o externos
gaps inner 10
gaps outer 10

### 🇬🇧 Edge borders
### 🇵🇹 Bordas finas
### 🇪🇸 Bordes finos
hide_edge_borders both

# 🇬🇧 Border indicator on windows:
# 🇵🇹 Indicador de borda nas janelas:
# 🇪🇸 Indicador de borde en ventanas:
new_window pixel 1

## 🇬🇧 Variables
## 🇵🇹 Variáveis
## 🇪🇸 Variables
X_AXIS=$(xrandr --current | grep '*' | uniq | awk '{print $1}' | cut -d 'x' -f1)
Y_AXIS=$(xrandr --current | grep '*' | uniq | awk '{print $1}' | cut -d 'x' -f2)
SCREEN_SIZE=$(($Xaxis))"×"$(($Yaxis))

## 🇬🇧 Changing the background image
## 🇵🇹 A mudar a imagem de fundo
## 🇪🇸 Cambiando la imagen de fondo
set $background "$HOME/.config/global/wallpapers/astronomy/$SCREEN_SIZE/astronomy-5.jpg"

## 🇬🇧 Changing i3 with Polybar and Sway with Waybar theme
## 🇵🇹 A mudar o tema do i3 com Polybar e do Sway com Waybar
## 🇪🇸 Cambiando el tema de i3 con Polybar y de Sway con Waybar
set $theme $HOME/.config/global/themes/definitions/endeavouros

DESKTOP_ENVIRONMENT=$(echo $XDG_CURRENT_DESKTOP | awk '{print tolower($0)}')

if [ "$DESKTOP_ENVIRONMENT" = "i3" ]; then

  ## 🇬🇧 i3blocks bar settings
  ## 🇵🇹 Configurações da barra do i3blocks
  ## 🇪🇸 Configuraciones de la barra de i3blocks

  ### 🇬🇧 Starting i3bar to display a workspace bar
  ### 🇵🇹 Iniciando i3bar para exibir uma barra de espaço de trabalho
  ### 🇪🇸 Iniciando i3bar para mostrar una barra de espacio de trabajo
  bar 
  {
    font pango: IBM Plex Sans 12
    status_command i3blocks -c ~/.config/i3/conf/i3blocks.conf
    position top
    i3bar_command i3bar --transparency 0.9
    # tray_output primary
    # tray_padding 0
    # strip_workspace_numbers yes
    # strip_workspace_name no

    colors 
    {
      separator           $purple
      background          $darkbluetrans
      statusline          $white
      # 🇬🇧                border	        background    text          indicator
      # 🇵🇹                borda           fundo         texto         indicador
      # 🇪🇸                borde           fondo         texto         indicador
      focused_workspace	  $lighterblue	  $lighterblue	$darkblue	    $purple
      active_workspace	  $lightdblue	    $lightdblue	  $darkblue	    $purple
      inactive_workspace	$darkblue	      $darkblue	    $lightdblue	  $purple
      urgent_workspace	  $urgentred	    $urgentred	  $white		    $purple
    }
  }

else

  # 🇬🇧 Empty settings for Sway
  # 🇵🇹 Configurações vazias para Sway
  # 🇪🇸 Configuraciones vacías para Sway

fi

### 🇬🇧 To resize the window (you can also use the mouse for that)
### 🇵🇹 Redimensionar a janela (também podes usar o mouse para isso)
### 🇪🇸 Redimensionar la ventana (también puedes usar el ratón para eso)
bindsym $mod+R mode "resize"

mode "resize" 
{
        # 🇬🇧 These bindings trigger as soon as you enter the resize mode
        # 🇵🇹 Estas teclas são ativadas assim que você entra no modo de redimensionamento
        # 🇪🇸 Estas teclas se activan cuando entras en el modo de redimensionamiento

        # 🇬🇧 Pressing left will shrink the window’s width.
        # 🇵🇹 Premir a esquerda reduzirá a largura da janela.
        # 🇪🇸 Presionar a izquierda reducirá el ancho de la ventana.

        # 🇬🇧 Pressing right will grow the window’s width.
        # 🇵🇹 Premir a direita aumentará a largura da janela.
        # 🇪🇸 Presionar a derecha aumentará el ancho de la ventana.

        # 🇬🇧 Pressing up will shrink the window’s height.
        # 🇵🇹 Premir a cima reduzirá a altura da janela.
        # 🇪🇸 Presionar arriba reducirá la altura de la ventana.

        # 🇬🇧 Pressing down will grow the window’s height.
        # 🇵🇹 Premir a baixo aumentará a altura da janela.
        # 🇪🇸 Presionar abajo aumentará la altura de la ventana.
        bindsym j resize shrink width 10 px or 10 ppt
        bindsym k resize grow height 10 px or 10 ppt
        bindsym l resize shrink height 10 px or 10 ppt
        bindsym ntilde resize grow width 10 px or 10 ppt

        # 🇬🇧 Same bindings, but for the arrow keys
        # 🇵🇹 Mesmas teclas, mas para as teclas de seta
        # 🇪🇸 Mismas teclas, pero para las teclas de flecha
        bindsym Left resize shrink width 10 px or 10 ppt
        bindsym Down resize grow height 10 px or 10 ppt
        bindsym Up resize shrink height 10 px or 10 ppt
        bindsym Right resize grow width 10 px or 10 ppt

        # 🇬🇧 Back to normal: Enter or Escape
        # 🇵🇹 Voltar ao normal: Enter ou Escape
        # 🇪🇸 Volver a lo normal: Enter o Escape
        bindsym Return mode "default"
        bindsym Escape mode "default"
}

smart_borders on
smart_gaps inverse_outer

set $mode_gaps Gaps: (o) outer, (i) inner
set $mode_gaps_inner Inner Gaps: +|-|0 (local), Shift + +|-|0 (global)
set $mode_gaps_outer Outer Gaps: +|-|0 (local), Shift + +|-|0 (global)

bindsym $mod+Shift+G mode "$mode_gaps"

mode "$mode_gaps" 
{
        bindsym o      mode "$mode_gaps_outer"
        bindsym i      mode "$mode_gaps_inner"
        bindsym Return mode "default"
        bindsym Escape mode "default"
}

mode "$mode_gaps_inner" 
{
        bindsym plus  gaps inner current plus 5
        bindsym minus gaps inner current minus 5
        bindsym 0     gaps inner current set 0

        bindsym Shift+plus  gaps inner all plus 5
        bindsym Shift+minus gaps inner all minus 5
        bindsym Shift+0     gaps inner all set 0

        bindsym Return mode "default"
        bindsym Escape mode "default"
}

mode "$mode_gaps_outer" 
{
        bindsym plus  gaps outer current plus 5
        bindsym minus gaps outer current minus 5
        bindsym 0     gaps outer current set 0

        bindsym Shift+plus  gaps outer all plus 5
        bindsym Shift+minus gaps outer all minus 5
        bindsym Shift+0     gaps outer all set 0

        bindsym Return mode "default"
        bindsym Escape mode "default"
}

# 🇬🇧 Window title alignment
# 🇵🇹 Alinhamento do título da janela
# 🇪🇸 Alineación del título de la ventana
title_align center

# 🇬🇧 Hiding cursor after 4 seconds of inactivity
# 🇵🇹 Ocultar o cursor após 4 segundos de inatividade
# 🇪🇸 Ocultar el cursor después de 4 segundos de inactividad
seat * hide_cursor 4000


set $gnome_schema org.gnome.desktop.interface

