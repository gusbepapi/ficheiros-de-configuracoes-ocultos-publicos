# vim:ft=i3config

# 🇬🇧 MODIFIER KEYS
# 🇵🇹 TECLAS MODIFICADORAS
# 🇪🇸 TECLAS MODIFICADORAS

## 🇬🇧 Setting the modifier key to the Windows key
## 🇵🇹 A definir a tecla modificadora para a tecla de Windows
## 🇪🇸 Configurando la tecla modificadora para la tecla de Windows
set $mod Mod4

## 🇬🇧 To use Mouse + $mod to drag floating windows to their wanted position
## 🇵🇹 Utilizar Mouse + $mod para arrastar janelas flutuantes para a sua posição desejada
## 🇪🇸 Utilizar Mouse + $mod para arrastrar ventanas flotantes a su posición deseada
floating_modifier $mod

## 🇬🇧 Home row direction keys, like Vim
## 🇵🇹 Teclas de direção da linha de casa, como o Vim
## 🇪🇸 Teclas de dirección de la línea de casa, como el Vim
set $left h
set $down j
set $up k
set $right l

## 🇬🇧 Favourite terminal emulator
## 🇵🇹 Emulador de terminal favorito
## 🇪🇸 Emulador de terminal favorito
set $term kitty