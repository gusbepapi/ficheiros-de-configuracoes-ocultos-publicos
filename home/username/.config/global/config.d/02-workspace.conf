# 🇬🇧 WOKRSPACE
# 🇵🇹 ESPAÇO DE TRABALHO
# 🇪🇸 ESPACIO DE TRABAJO

## 🇬🇧 Workspace layouts
## 🇵🇹 Layouts de espaço de trabalho
## 🇪🇸 Diseños de espacio de trabajo

### 🇬🇧 Available values
### 🇵🇹 Valores disponíveis
### 🇪🇸 Valores disponibles
### default     - 🇬🇧 Default i3 tiling mode
###             - 🇵🇹 Modo de encaixe padrão do i3
###             - 🇪🇸 Modo de encaje predeterminado de i3
### stacking    - 🇬🇧 Each window will be fullscreen and tabbed top to bottom.
###             - 🇵🇹 Cada janela será no ecrã cheio e em guias de cima para baixo.
###             - 🇪🇸 Cada ventana será a pantalla completa y en pestañas de arriba a abajo.
### tabbed      - 🇬🇧 Each new window will open fullscreen as a tab (left to right)
###             - 🇵🇹 Cada nova janela será aberta no ecrã cheio como uma guia (da esquerda para a direita)
###             - 🇪🇸 Cada nueva ventana se abrirá a pantalla completa como una pestaña (de izquierda a derecha)
workspace_layout default

set $ws1 " "
set $ws2 "龜 "
set $ws3 ""
set $ws4 ""
set $ws5 "﬏"

### 🇬🇧 Assign applications to workspaces
### 🇵🇹 Atribuir aplicações aos espaços de trabalho
### 🇪🇸 Asignar aplicaciones a los espacios de trabajo

#### VSCode
assign [class="(?i)code-insiders"] $ws1
for_window [class="(?i)code-insiders"] focus

#### Firefox
assign [class="(?i)firefox"] $ws2
for_window [class="(?i)firefox"] focus

#### Firefox Developer Edition
assign [app_id="^firefoxdeveloperedition$"] $ws2
for_window [app_id="^firefoxdeveloperedition$"] focus

#### Firefox Nightly
assign [app_id="^firefoxnightly$"] $ws2
for_window [app_id="^firefoxnightly$"] focus

#### Microsoft Edge Developer
assign [class="(?i)microsoft-edge-dev"] $ws2
for_window [class="(?i)microsoft-edge-dev"] focus

#### Google Chrome
assign [class="(?i)chrome"] $ws2
for_window [class="(?i)chrome"] focus

