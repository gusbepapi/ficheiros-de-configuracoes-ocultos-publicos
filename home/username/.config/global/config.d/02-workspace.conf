#### 🇬🇧 Launcher
#### 🇵🇹 Lançador
#### 🇪🇸 Lanzador
for_window [app_id="^launcher$"] floating enable, sticky enable, resize set 30 ppt 60 ppt, border pixel 10

#### Ark
for_window [class="ark" instance="ark"] floating enable
for_window [class="ark"] resize set 800 400

#### Autokey
for_window [class="autokey-qt" instance="autokey-qt"] floating enable
for_window [class="autokey-qt"] resize set 670 300

for_window [app_id="autokey-qt" instance="autokey-qt"] floating enable
for_window [app_id="autokey-qt"] resize set 670 300

#### Blueberry
for_window [class="Blueberry.py" instance="blueberry.py"] floating enable
for_window [class="Bluetooth-sendto" instance="bluetooth-sendto"] floating enable

#### Galculator
for_window [class="Galculator" instance="galculator"] floating enable

#### GNOME Disks
for_window [class="Gnome-disks"] floating enable

#### GWenView
for_window [class="gwenview" instance="gwenview"] floating enable
for_window [class="gwenview"] resize set 1200 900

#### KRename
for_window [class="krename" instance="krename"] floating enable; ; border none

#### KRunner
for_window [class="krunner" instance="krunner"] floating enable; ; border none

#### Network Connection Editor
for_window [class="nm-connection-editor" instance="nm-connection-editor"] floating enable

#### PAMAC Manager
for_window [class="Pamac-manager"] floating enable

#### PulseAudio Volume Control
for_window [class="Pavucontrol" instance="pavucontrol"] floating enable

#### Peek
for_window [class="Peek"] floating enable

#### QT5ct
for_window [class="qt5ct" instance="qt5ct"] floating enable

#### Ulauncher
for_window [class="ulauncher" instance="ulauncher"] floating enable

#### XFCE4 App Finder
for_window [class="Xfce4-appfinder"] floating enable

#### Yad
for_window [class="Yad" instance="yad"] floating enable

for_window [app_id="firefox" title="^Extension: \(PassFF\)"] floating enable
for_window [app_id="fzf-launcher"] focus, floating enabled, border pixel 1

for_window [title="About Firefox Developer"] floating enable
for_window [title="About Mozilla Firefox"] floating enable
for_window [title="Copying"] floating enable
for_window [title="Deleting"] floating enable
for_window [title="Export Image*"] floating enable
for_window [title="Moving"] floating enable
for_window [title="Procurar e Substituir — KRename"] floating enable
for_window [title="Procurar e Substituir — KRename"] resize set 830 400
for_window [title="Void Linux - Soft Keyboard"] floating enable
for_window [window_role="pop-up"] floating enable
for_window [window_role="^Preferences$"] floating enable
for_window [window_role="setup"] floating enable

for_window [title="^Introduza o nome do ficheiro*"] floating enable; ; border none
for_window [title="^Introduza o nome do ficheiro*"] resize set 800 400
for_window [title="^Void Linux *"] floating enable
for_window [title="^Void Linux *"] resize set 1440 900

for_window [title="quake_.*"] move window to scratchpad

## 🇬🇧 To switch to workspace with urgent window automatically
## 🇵🇹 Mudar para o espaço de trabalho com janela urgente automaticamente
## 🇪🇸 Cambiar al espacio de trabajo con ventana urgente automáticamente
for_window [urgent = latest] focus

# 🇬🇧 Inhibiting idle
# 🇵🇹 Inibir ocioso
# 🇪🇸 Inhibir ocioso
for_window [app_id="code - insiders"] inhibit_idle fullscreen