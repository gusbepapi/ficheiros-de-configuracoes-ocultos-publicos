[%General]
language=pt_PT

[PlotDock]
lineType=1
pointShape=4
splitterSize=@ByteArray(\0\0\0\xff\0\0\0\x1\0\0\0\x2\0\0\x1\x80\0\0\x2\xd0\x1\xff\xff\xff\xff\x1\0\0\0\x2\0)

[SQLLogDock]
Log=Application

[SchemaDock]
dropEnquotedNames=true
dropQualifiedNames=false

[databrowser]
auto_switch_mode=true
indent_compact=false

[exportcsv]
firstrowheader=true
newlinecharacters=\n
quotecharacter=34
separator=44

[exportjson]
prettyprint=true
