# 🇬🇧 Change prefix to Ctrl + A
# 🇵🇹 Alterar o prefixo para Ctrl + A
# 🇪🇸 Cambiar el prefijo a Ctrl + A
unbind C-b
set -g prefix C-a
set -g mouse on

bind -n End send-key C-e
bind -n Home send-key C-a

# 🇬🇧 List of plugins
# 🇵🇹 Lista de plugins
# 🇪🇸 Lista de plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g default-terminal tmux-256color
set-option -ga terminal-overrides ",*256col*:Tc"

set -g status-right '#{prefix_highlight}'

# 🇬🇧 Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# 🇵🇹 Inicializar o gestor de plugins do TMUX (mantenha esta linha na parte inferior do tmux.conf)
# 🇪🇸 Inicializar el gestor de plugins de TMUX (mantenga esta línea en la parte inferior de tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
